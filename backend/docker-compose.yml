version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: lawgpt-backend:latest
    container_name: lawgpt_backend_container
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./generated:/app/generated
      - ./temp:/app/temp
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    restart: unless-stopped
